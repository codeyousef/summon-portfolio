name: Promote portfolio production to Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_CLOUDFLARE_PRODUCTION
        required: true
        type: string

concurrency:
  group: portfolio-deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  PORTFOLIO_PROD_ORIGIN: ${{ vars.PORTFOLIO_PROD_ORIGIN }}

jobs:
  verify:
    name: Verify protected production candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: portfolio-production
    steps:
      - name: Require provisioned production and exact operator confirmation
        env:
          READY: ${{ vars.PORTFOLIO_CLOUDFLARE_PROD_READY }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "${READY}" = "true"
          test "${CONFIRMATION}" = "DEPLOY_CLOUDFLARE_PRODUCTION"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing production CLOUDFLARE_ACCOUNT_ID}"
          : "${PORTFOLIO_PROD_ORIGIN:?Missing PORTFOLIO_PROD_ORIGIN}"

      - name: Check out the exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test portfolio
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2
        run: ./gradlew --no-daemon --max-workers=2 test

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Verify edge contracts
        working-directory: cloudflare/portfolio-edge
        run: |
          pnpm install --frozen-lockfile
          pnpm verify

  deploy:
    name: Apply reviewed Cloudflare production release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify
    environment: portfolio-production
    steps:
      - name: Check out the verified candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install edge dependencies
        working-directory: cloudflare/portfolio-edge
        run: pnpm install --frozen-lockfile

      - name: Generate, dry-run, and deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIRESTORE_DATABASE_ID: ${{ vars.PORTFOLIO_PROD_FIRESTORE_DATABASE_ID }}
          FIRESTORE_WRITE_MODE: ${{ vars.PORTFOLIO_PROD_FIRESTORE_WRITE_MODE }}
          FIRESTORE_MIGRATION_PROOF_ID: ${{ vars.PORTFOLIO_PROD_FIRESTORE_MIGRATION_PROOF_ID }}
          PHOTOGRAPHY_WRITE_MODE: ${{ vars.PORTFOLIO_PROD_PHOTOGRAPHY_WRITE_MODE || 'source' }}
          PHOTOGRAPHY_UPLOAD_BUCKET: ${{ vars.PORTFOLIO_PROD_PHOTOGRAPHY_UPLOAD_BUCKET }}
          SAMURAI_FINOPS_IDENTITY_URL: ${{ vars.PORTFOLIO_PROD_SAMURAI_FINOPS_IDENTITY_URL }}
        working-directory: cloudflare/portfolio-edge
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing production CLOUDFLARE_API_TOKEN}"
          : "${FIRESTORE_DATABASE_ID:?Missing PORTFOLIO_PROD_FIRESTORE_DATABASE_ID}"
          : "${FIRESTORE_WRITE_MODE:?Missing PORTFOLIO_PROD_FIRESTORE_WRITE_MODE}"
          : "${PHOTOGRAPHY_UPLOAD_BUCKET:?Missing PORTFOLIO_PROD_PHOTOGRAPHY_UPLOAD_BUCKET}"
          : "${SAMURAI_FINOPS_IDENTITY_URL:?Missing PORTFOLIO_PROD_SAMURAI_FINOPS_IDENTITY_URL}"

          config="wrangler.generated.ci.prod.json"
          trap 'rm -f "${config}"' EXIT
          test ! -e "${config}"
          before="$(pnpm exec wrangler versions list --name yousef-portfolio-edge-prod --json | jq -r '.[-1].id // "none"')"
          pool_version="ci-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          args=(
            --environment prod
            --canonical-origin "${PORTFOLIO_PROD_ORIGIN}"
            --container-pool-version "${pool_version}"
            --firestore-project portfolio-476219
            --firestore-database "${FIRESTORE_DATABASE_ID}"
            --firestore-write-mode "${FIRESTORE_WRITE_MODE}"
            --photography-write-mode "${PHOTOGRAPHY_WRITE_MODE}"
            --photography-upload-bucket "${PHOTOGRAPHY_UPLOAD_BUCKET}"
            --samurai-finops-identity-url "${SAMURAI_FINOPS_IDENTITY_URL}"
            --output "${config}"
          )
          if test -n "${FIRESTORE_MIGRATION_PROOF_ID}"; then
            args+=(--firestore-migration-proof-id "${FIRESTORE_MIGRATION_PROOF_ID}")
          fi
          node scripts/generate-config.mjs "${args[@]}"

          pnpm exec wrangler deploy --config "${config}" --dry-run
          pnpm exec wrangler deploy \
            --config "${config}" \
            --message "Protected GitHub production ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            --tag "github-${GITHUB_SHA}"
          after="$(pnpm exec wrangler versions list --config "${config}" --json | jq -r '.[-1].id')"
          [[ "${after}" =~ ^[0-9a-f-]{36}$ ]]
          {
            echo "### Portfolio Cloudflare production deployment"
            echo "- Previous Worker version: \`${before}\`"
            echo "- Deployed Worker version: \`${after}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            printf -- "- Rollback: \`pnpm exec wrangler rollback %s --name yousef-portfolio-edge-prod\`\n" "${before}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 5 --max-time 30 "${PORTFOLIO_PROD_ORIGIN}/health/ready")"
          jq -e '.status == "ok" and .environment == "prod" and .ready == true and .regionPolicy == ["ME", "WEUR"]' <<<"${response}" >/dev/null
