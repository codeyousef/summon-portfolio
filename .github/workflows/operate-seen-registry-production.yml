name: Retired Seen GCP production operations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Refuse legacy GCP production operations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain the Cloudflare migration boundary
        shell: bash
        run: |
          echo '::error::This GCP production operations workflow is retired. Seen production operations remain blocked until the Cloudflare signer and recovery gates pass.'
          exit 1
