name: Validate Seen Cloudflare migration

on:
  pull_request:
    paths:
      - .github/workflows/deploy-seen-registry.yml
      - cloudflare/seen-edge/**
      - registry-service/**
  push:
    branches: [dev, master]
    paths:
      - .github/workflows/deploy-seen-registry.yml
      - cloudflare/seen-edge/**
      - registry-service/**
  workflow_dispatch:

concurrency:
  group: seen-cloudflare-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate the registry and fail-closed Cloudflare edge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            registry-service/*.gradle.kts
            registry-service/gradle.properties

      - name: Test and package the isolated registry
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2
        run: |
          ./gradlew \
            -p registry-service \
            --no-daemon \
            --max-workers=2 \
            test shadowJar

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install Seen edge dependencies
        working-directory: cloudflare/seen-edge
        run: pnpm install --frozen-lockfile

      - name: Validate the Cloudflare edge contract
        working-directory: cloudflare/seen-edge
        run: |
          pnpm run config:check
          pnpm run check
          pnpm test

      - name: Enforce the signer and recovery deployment gate
        shell: bash
        run: |
          set -euo pipefail
          readme=cloudflare/seen-edge/README.md
          grep -Fq 'Deployment remains blocked until all of the following' "${readme}"
          grep -Fq 'SEEN_SIGNER_GUARD' "${readme}"
          grep -Fq 'complete promotion/maintenance recovery exercise' "${readme}"
          prohibited_pattern='wrangler '"deploy"'|wrangler secret '"put"'|gcloud run '"deploy"'|docker\\.'"pkg\\.dev"
          if rg -n "${prohibited_pattern}" .github/workflows/deploy-seen-registry.yml; then
            echo 'Seen deployment must remain fail-closed until every tracked signer/recovery gate passes' >&2
            exit 1
          fi
