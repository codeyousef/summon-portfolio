name: Deploy portfolio development to Cloudflare

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/deploy.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'Dockerfile.portfolio'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'src/**'
      - 'compiler_seen/**'
      - 'seen_runtime/**'
      - 'seen_std/**'
      - 'scripts/prepare-seen-release-tools.sh'
      - 'cloudflare/portfolio-edge/**'
  workflow_dispatch:

concurrency:
  group: portfolio-deploy-development
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  PORTFOLIO_DEV_ORIGIN: ${{ vars.PORTFOLIO_DEV_ORIGIN || 'https://yousef-portfolio-edge-dev.yousef-d2f.workers.dev' }}

jobs:
  verify:
    name: Verify portfolio Cloudflare release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test portfolio
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2
        run: ./gradlew --no-daemon --max-workers=2 test

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install edge dependencies
        working-directory: cloudflare/portfolio-edge
        run: pnpm install --frozen-lockfile

      - name: Verify Worker and generated-config contracts
        working-directory: cloudflare/portfolio-edge
        run: pnpm verify

  deploy:
    name: Deploy Worker and Containers to Cloudflare dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    environment: portfolio-development
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install edge dependencies
        working-directory: cloudflare/portfolio-edge
        run: pnpm install --frozen-lockfile

      - name: Prepare pinned Seen playground toolchain
        run: bash scripts/prepare-seen-release-tools.sh

      - name: Validate scoped Cloudflare deployment identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing portfolio-development variable CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?Missing portfolio-development secret CLOUDFLARE_API_TOKEN}"
          [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-f]{32}$ ]]

      - name: Generate, dry-run, and deploy the reviewed dev contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: cloudflare/portfolio-edge
        shell: bash
        run: |
          set -euo pipefail
          config="wrangler.generated.ci.dev.json"
          trap 'rm -f "${config}"' EXIT
          test ! -e "${config}"

          before="$(pnpm exec wrangler versions list --name yousef-portfolio-edge-dev --json | jq -r '.[-1].id // "none"')"
          pool_version="ci-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          node scripts/generate-config.mjs \
            --environment dev \
            --canonical-origin "${PORTFOLIO_DEV_ORIGIN}" \
            --container-pool-version "${pool_version}" \
            --firestore-project portfolio-476219 \
            --firestore-database portfolio-me-dev \
            --firestore-write-mode source \
            --photography-write-mode source \
            --photography-upload-bucket portfolio-476219-portfolio-uploads \
            --samurai-finops-identity-url https://samurai.dev.felidai.com/internal/portfolio/finops/identities \
            --workers-dev \
            --output "${config}"

          pnpm exec wrangler deploy --config "${config}" --dry-run
          pnpm exec wrangler deploy \
            --config "${config}" \
            --message "GitHub ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            --tag "github-${GITHUB_SHA}"

          after="$(pnpm exec wrangler versions list --config "${config}" --json | jq -r '.[-1].id')"
          [[ "${after}" =~ ^[0-9a-f-]{36}$ ]]
          {
            echo "### Portfolio Cloudflare dev deployment"
            echo "- Previous Worker version: \`${before}\`"
            echo "- Deployed Worker version: \`${after}\`"
            echo "- Container pool version: \`${pool_version}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify the public dev origin
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 --max-time 30 "${PORTFOLIO_DEV_ORIGIN}/health/ready")"
          jq -e '
            .status == "ok" and
            .environment == "dev" and
            .ready == true and
            .firestoreDatabase == "portfolio-me-dev" and
            .firestoreWriteMode == "source" and
            .regionPolicy == ["ME", "WEUR"]
          ' <<<"${response}" >/dev/null
