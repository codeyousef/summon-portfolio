name: Retired Seen GCP production infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Refuse legacy GCP infrastructure changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain the Cloudflare migration boundary
        shell: bash
        run: |
          echo '::error::This GCP production infrastructure workflow is retired. Seen production changes must use the protected Cloudflare production workflow after its signer and recovery gates are approved.'
          exit 1
